<!-- Neon Coast RP loading screen (join623 v3). One self-contained file: no external fetches, fonts, CDNs.
     ES5 only (old Awesomium + GMod Chromium). Layout: a 1920x1080 "stage" scaled to fit (contain) and centred;
     the canvas scene behind it covers the whole window and is anchored to the stage horizon.
     Host over http(s) and set: sv_loadingurl "https://<host>/neoncoast_loading.html?steamid=%s&map=%m"
     Optional URL params: players=12&max=64, name=<server name>, nocanvas=1 (force the CSS fallback). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07031a;color:#f1ecff;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#fallback{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#07031a}
#fbsky{position:absolute;left:0;right:0;top:0;background:#1b0638;background:-webkit-linear-gradient(top,#07031a 0%,#1b0638 45%,#4a0b4f 80%,#ff3f7f 100%);background:linear-gradient(180deg,#07031a 0%,#1b0638 45%,#4a0b4f 80%,#ff3f7f 100%)}
#fbsea{position:absolute;left:0;right:0;bottom:0;background:#2a0a45;background:-webkit-linear-gradient(top,#3a0c4f,#07031a);background:linear-gradient(180deg,#3a0c4f,#07031a)}
#fbsun{position:absolute;border-radius:50% 50% 0 0;background:#ff7a5c;background:-webkit-linear-gradient(top,#ffb347,#ff3f7f);background:linear-gradient(180deg,#ffb347,#ff3f7f)}
#scene{position:absolute;left:0;top:0;display:block}
#grain{position:absolute;left:0;top:0;right:0;bottom:0;opacity:.07;pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;-webkit-transform-origin:0 0;-ms-transform-origin:0 0;transform-origin:0 0}
/* slideshow: fixed 16:9 frame, images cover it */
#slides{position:absolute;left:120px;top:236px;width:944px;height:531px;overflow:hidden;border-radius:8px;background:#120626;
 border:3px solid #ff3fae;box-shadow:0 0 6px #fff,0 0 20px #ff3fae,0 0 48px rgba(255,63,174,.45)}
#slides .s{position:absolute;left:-6%;top:-6%;width:112%;height:112%;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;
 -webkit-transition:opacity 1.6s ease;transition:opacity 1.6s ease}
#slides .s.on{opacity:1}
#slides .tint{position:absolute;left:0;top:0;right:0;bottom:0;background:-webkit-linear-gradient(top,rgba(40,0,70,.28),rgba(7,3,26,0) 45%,rgba(60,0,60,.45));background:linear-gradient(180deg,rgba(40,0,70,.28),rgba(7,3,26,0) 45%,rgba(60,0,60,.45))}
#cap{position:absolute;left:20px;bottom:16px;font-size:20px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:#fff;text-shadow:0 0 6px #00e5ff,0 0 14px #00e5ff,0 2px 3px #000}
#dots{position:absolute;right:18px;bottom:22px}
#dots i{display:inline-block;width:9px;height:9px;margin-left:7px;border-radius:50%;background:rgba(255,255,255,.3)}
#dots i.on{background:#ff3fae;box-shadow:0 0 8px #ff3fae}
/* title sign */
#sign{position:absolute;left:0;width:1920px;top:52px;text-align:center;font-weight:900;letter-spacing:8px;line-height:110px;height:110px;font-size:96px;white-space:nowrap}
#sign .l{display:inline-block;color:#fff;text-shadow:0 0 4px #fff,0 0 12px #ff3fae,0 0 26px #ff3fae,0 0 48px #ff3fae}
#sign .c{text-shadow:0 0 4px #fff,0 0 12px #00e5ff,0 0 26px #00e5ff,0 0 48px #00e5ff}
#sign .l.off{color:#3d2347;text-shadow:none}
#sign .sp{display:inline-block;width:34px}
#sub{position:absolute;left:0;width:1920px;top:170px;text-align:center;font-size:20px;letter-spacing:14px;color:#00e5ff;text-transform:uppercase;text-shadow:0 0 8px rgba(0,229,255,.8)}
/* info panel */
#panel{position:absolute;left:120px;top:806px;width:944px;padding:20px 26px;border:2px solid rgba(255,63,174,.75);border-radius:12px;background:rgba(12,6,36,.86);box-shadow:0 0 26px rgba(255,63,174,.3)}
.row{overflow:hidden;font-size:19px;color:#a99fd0;height:26px}
.row .a{float:left}.row .b{float:right}
.row strong{color:#f1ecff;font-weight:600}
#status{margin:12px 0 10px;font-size:23px;color:#f1ecff;height:30px;line-height:30px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{height:14px;border-radius:7px;background:#24164a;overflow:hidden}
#fill{height:100%;width:0;background:#ff3fae;background:-webkit-linear-gradient(left,#00e5ff,#ff3fae);background:linear-gradient(90deg,#00e5ff,#ff3fae);-webkit-transition:width .3s;transition:width .3s}
#file{margin-top:8px;font-size:16px;color:#a99fd0;height:21px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tip{margin-top:10px;font-size:19px;color:#ffd1ec;height:26px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;-webkit-transition:opacity .5s;transition:opacity .5s}
</style>

 var on=true;if(s.f>t)on=Math.random()<.5;else if(Math.random()<.003)s.f=t+rnd(150,900);
 var x=sx(s.x),y=OY+s.y*U,fs=Math.round(34*U);
 ctx.font="bold "+fs+"px 'Segoe UI',Arial,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=Math.max(1,2*U);
 if(on){ctx.shadowColor=s.c;ctx.shadowBlur=Math.min(24,18*U);ctx.strokeStyle=s.c;ctx.strokeText(s.t,x,y);ctx.shadowBlur=Math.min(8,6*U);ctx.fillStyle="#fff";ctx.fillText(s.t,x,y);ctx.shadowBlur=0;ctx.shadowColor="rgba(0,0,0,0)";}
 else{ctx.strokeStyle="rgba(90,50,100,.85)";ctx.strokeText(s.t,x,y);}
 s.lit=on;
}
function drawRoad(t,dt){
 var ry=HZ-3*U;ctx.fillStyle="#0a0418";ctx.fillRect(0,ry,W,Math.max(3,4*U));
 if(Math.random()<dt*.4)cars.push({x:0,v:rnd(180,340)*U,dir:Math.random()<.5?1:-1,init:false});
 var len=80*U;
 for(var i=cars.length-1;i>=0;i--){var c=cars[i];if(!c.init){c.x=c.dir>0?-len:W+len;c.init=true;}c.x+=c.dir*c.v*dt;
  var g=ctx.createLinearGradient(c.x-c.dir*len,0,c.x,0);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,c.dir>0?"rgba(255,240,210,.95)":"rgba(255,40,60,.95)");
  ctx.fillStyle=g;ctx.fillRect(Math.min(c.x,c.x-c.dir*len),ry,len,Math.max(1.5,2*U));
  if(c.x<-2*len||c.x>W+2*len)cars.splice(i,1);}
 if(!heli&&Math.random()<dt*.03)heli={x:-20,y:OY+rnd(150,380)*U,v:rnd(35,60)*U};
 if(heli){heli.x+=heli.v*dt;var blink=(Math.floor(t/600)%2)===0,hs=Math.max(2,3*U);
  ctx.fillStyle=blink?"#ff2040":"#fff";ctx.fillRect(heli.x,heli.y,hs,hs);
  if(blink){var bg=ctx.createLinearGradient(0,heli.y,0,HZ);bg.addColorStop(0,"rgba(255,255,255,.1)");bg.addColorStop(1,"rgba(255,255,255,0)");
   ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(heli.x,heli.y);ctx.lineTo(heli.x-50*U,HZ);ctx.lineTo(heli.x+50*U,HZ);ctx.closePath();ctx.fill();}
  if(heli.x>W+30)heli=null;}
}
function drawWater(t){
 ctx.fillStyle=seaG;ctx.fillRect(0,HZ,W,H-HZ);
 var cx=sx(SUN_X),r=SUN_R*U,step=Math.max(3,4*U),bar=Math.max(1.5,2*U),i=0,y,k;
 for(y=HZ+2;y<H;y+=step,i++){k=(y-HZ)/Math.max(1,H-HZ);
  var wob=Math.sin(t*.003+i*.7)*8*U*(1+k*3),half=r*(1-k*.55)*(.55+.45*Math.sin(t*.002+i*1.3));
  ctx.fillStyle="rgba(255,"+Math.round(120-60*k)+",140,"+(.55*(1-k)).toFixed(3)+")";ctx.fillRect(cx-half+wob,y,half*2,bar);}
 for(var s=0;s<signs.length;s++){var gx=sx(signs[s].x);ctx.fillStyle=signs[s].c;
  for(var j=0;j<16;j++){var yy=HZ+8*U+j*8*U,ww=(22+Math.sin(t*.004+j+s)*12)*U;ctx.globalAlpha=.28*(1-j/16)*(signs[s].lit?1:.25);ctx.fillRect(gx-ww/2+Math.sin(t*.003+j)*6*U,yy,ww,bar);}}
 ctx.globalAlpha=1;ctx.strokeStyle="rgba(255,63,174,.16)";ctx.lineWidth=1;
 for(var l=0;l<10;l++){var p=(l+1)/11,yl=HZ+(H-HZ)*p*p+Math.sin(t*.001+l)*2*U;ctx.beginPath();
  for(var x=0;x<=W+24;x+=24){var y2=yl+Math.sin(x*.02/U+t*.002+l)*2*U*(1+p);if(x===0)ctx.moveTo(x,y2);else ctx.lineTo(x,y2);}ctx.stroke();}
}
function drawPalm(t,p){
 var bx=sx(p.x),by=HZ+10*U,hgt=330*U*p.s,sway=Math.sin(t*.0009+p.p)*.04;
 ctx.fillStyle="#05020f";ctx.strokeStyle="#05020f";ctx.lineCap="round";
 var tx=bx+hgt*(.16+sway),ty=by-hgt;
 // trunk: tapered
 ctx.beginPath();ctx.moveTo(bx-8*U*p.s,by);ctx.quadraticCurveTo(bx+hgt*.03,by-hgt*.55,tx-3*U*p.s,ty);ctx.lineTo(tx+3*U*p.s,ty);ctx.quadraticCurveTo(bx+hgt*.06,by-hgt*.55,bx+8*U*p.s,by);ctx.closePath();ctx.fill();
 // fronds: drooping leaf shapes
 var n=8;for(var i=0;i<n;i++){var a=(i/(n-1))*Math.PI*1.1-Math.PI*1.05+sway*2+Math.sin(t*.0014+i*1.7+p.p)*.04;
  var len=hgt*(.38+.06*Math.sin(i*2.3)),ca=Math.cos(a),sa=Math.sin(a);
  var ex=tx+ca*len,ey=ty+sa*len*.35+len*.42,mx=tx+ca*len*.55,my=ty+sa*len*.55-len*.08,wd=len*.09;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(mx-sa*wd,my-wd,ex,ey);ctx.quadraticCurveTo(mx+sa*wd*.4,my+wd*.6,tx,ty);ctx.fill();}
 ctx.beginPath();ctx.arc(tx,ty+2*U,7*U*p.s,0,6.2832);ctx.fill();
}
function frame(now){
 if(!hidden){
  var dt=last?Math.min(.1,(now-last)/1000):0;last=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;
  drawSky(now,dt);drawSun();drawSkyline(now,0,8);drawSkyline(now,1,16);
  for(var i=0;i<signs.length;i++)drawTube(now,signs[i]);
  drawRoad(now,dt);drawWater(now);
  for(i=0;i<palms.length;i++)drawPalm(now,palms[i]);
  kenBurns(+new Date());
 }else last=0;
 raf(frame);
}
var rt;
if(ctx){build();$("fallback").style.display="none";window.onresize=function(){clearTimeout(rt);rt=setTimeout(build,150);};raf(frame);}
else{cv.style.display="none";layout();window.onresize=function(){clearTimeout(rt);rt=setTimeout(layout,150);};setInterval(function(){kenBurns(+new Date());},50);}

/* ---------------- loading state ---------------- */
var total=0,needed=0,got=0,lastPct=0;
function setPct(p){p=Math.max(lastPct,Math.min(100,p));lastPct=p;$("fill").style.width=p.toFixed(1)+"%";}
function fileLine(name){var s=String(name||"");if(s.length>90)s="..."+s.slice(-87);txt("file",(total>0?("["+Math.min(got,total)+"/"+total+"] "):"")+s);}
var tips=["Press F4 for jobs, shops and your character.","Lock your car. Neon Coast has no shortage of thieves.",
 "Stay in character: real names and meta talk break the scene.","Police can see your plates. Drive like it.",
 "Rejoins are fast: content you already have is not downloaded again.","Hold C for the context menu, Q for the quick wheel.",
 "Need staff? Use the report menu instead of yelling in OOC.","Keep cash in the bank. What you carry, you can lose."];
var ti=Math.floor(Math.random()*tips.length);txt("tip",tips[ti]);
setInterval(function(){var t=$("tip");t.style.opacity=0;setTimeout(function(){ti=(ti+1)%tips.length;txt("tip",tips[ti]);t.style.opacity=1;},500);},7000);
if(P.map&&P.map.indexOf("%")<0)txt("map",P.map);if(P.name)txt("server",P.name);
if(P.players)txt("plw","  ·  "+P.players+(P.max?"/"+P.max:"")+" online");
window.GameDetails=function(servername,serverurl,mapname,maxplayers,steamid,gamemode){
 if(servername)txt("server",servername);if(mapname)txt("map",mapname);
 if(maxplayers&&!$("plw").firstChild)txt("plw","  ·  "+maxplayers+" slots");txt("status","Joining Neon Coast...");setPct(3);};
window.SetFilesTotal=function(n){total=Math.max(0,parseInt(n,10)||0);needed=total;got=0;setPct(5);};
window.SetFilesNeeded=function(n){needed=Math.max(0,parseInt(n,10)||0);if(total>0){got=total-needed;setPct(5+85*(got/total));}};
window.DownloadingFile=function(f){got++;if(total>0)setPct(5+85*Math.min(1,got/total));fileLine(f);};
window.SetStatusChanged=function(s){s=String(s||"");txt("status",s);
 if(/workshop/i.test(s))setPct(10);if(/lua/i.test(s))setPct(80);if(/sending client info/i.test(s))setPct(92);if(/client info sent|starting lua/i.test(s))setPct(96);};
setInterval(function(){if(lastPct<88)setPct(lastPct+.12);},1000);
})();
</script>

<style>
#ncmute{position:absolute;right:18px;top:18px;z-index:50;width:44px;height:44px;border-radius:50%;border:2px solid #00e5ff;background:rgba(12,6,36,.8);color:#00e5ff;
 font:bold 18px "Segoe UI",Arial,sans-serif;line-height:40px;text-align:center;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.7),inset 0 0 8px rgba(0,229,255,.35);text-shadow:0 0 6px #00e5ff;outline:none;padding:0}
#ncmute.off{border-color:#ff3fae;color:#ff3fae;box-shadow:0 0 10px rgba(255,63,174,.7);text-shadow:0 0 6px #ff3fae}
</style>
<audio id="ncmusic" preload="auto"><source src="music.ogg" type="audio/ogg"><source src="music.mp3" type="audio/mpeg"></audio>
<button id="ncmute" type="button" title="Mute / unmute music">&#9835;</button>
<script>
(function(){
var a=document.getElementById("ncmusic"),btn=document.getElementById("ncmute");if(!a||!a.play)return;
var VOL=0.35,LOOP_START=0,LOOP_END=114.85,muted=false,level=0,target=VOL,fadeT=null,done=false,started=false;
try{muted=window.localStorage&&localStorage.getItem("nc_music_muted")==="1";}catch(e){}
function paint(){btn.className=muted?"off":"";btn.innerHTML=muted?"&#215;":"&#9835;";}
function apply(){try{a.volume=Math.max(0,Math.min(1,muted?0:level));}catch(e){}}
function fadeTo(v,secs,cb){if(fadeT)clearInterval(fadeT);var from=level,steps=Math.max(1,Math.round(secs*20)),i=0;
 fadeT=setInterval(function(){i++;level=from+(v-from)*(i/steps);apply();if(i>=steps){clearInterval(fadeT);fadeT=null;if(cb)cb();}},50);}
function start(){if(done||started)return;level=0;apply();var p;try{p=a.play();}catch(e){return;}
 if(p&&p.then){p.then(function(){started=true;fadeTo(target,1.5);},function(){});}else{started=true;fadeTo(target,1.5);}}
a.addEventListener("timeupdate",function(){if(a.currentTime>=LOOP_END-0.08){a.currentTime=LOOP_START;}});
a.addEventListener("ended",function(){if(!done){a.currentTime=LOOP_START;try{a.play();}catch(e){}}});
function kick(){start();}
document.addEventListener("click",kick);document.addEventListener("keydown",kick);
btn.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();muted=!muted;
 try{localStorage.setItem("nc_music_muted",muted?"1":"0");}catch(e){}paint();apply();start();};
function finish(){if(done)return;done=true;fadeTo(0,3,function(){try{a.pause();}catch(e){}});}
var prev=window.SetStatusChanged;
window.SetStatusChanged=function(s){if(prev)try{prev(s);}catch(e){}if(/sending client info|client info sent/i.test(String(s||"")))finish();};
setTimeout(finish,10*60*1000);
paint();start();
})();
</script>
