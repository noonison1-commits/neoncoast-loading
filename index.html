<script>
(function(){
function $(i){return document.getElementById(i);}
function txt(i,s){var e=$(i);if(e&&s!=null)e.textContent=String(s);}
var tips=[
["Rule","This is serious RP. Stay in character; out-of-character talk belongs in OOC chat."],
["Menu","Press F8 for the city menu: jobs, licences, property and settings."],
["Controls","Hold Q for the action wheel. Everything you can do is one gesture away."],
["Vehicles","Rolled your car? Type /flip next to it to set it back on its wheels."],
["Style","Visit the clothing store downtown. First impressions matter in Vela Bay."],
["Trade","The dealer moves vehicles, quietly. Ask around; do not ask twice."],
["Rule","No random deathmatch. Every conflict needs a reason and a story."],
["Rule","Value your life. A gun in your face means you comply."]];
var ti=0,lastPct=0,total=0,got=0;
function setPct(p){p=Math.max(lastPct,Math.min(100,p));lastPct=p;$("fill").style.width=p.toFixed(1)+"%";txt("pct",Math.floor(p)+"%");}
setInterval(function(){var t=$("tip");t.style.opacity=0;setTimeout(function(){ti=(ti+1)%tips.length;txt("tiplab",tips[ti][0]);txt("tip",tips[ti][1]);t.style.opacity=1;},600);},8000);
try{var q=location.search.replace(/^\?/,"").split("&");for(var i=0;i<q.length;i++){var kv=q[i].split("=");if(kv[0]=="map"&&kv[1]&&kv[1].indexOf("%")<0)txt("map",decodeURIComponent(kv[1]));}}catch(e){}
window.GameDetails=function(sn,su,map,mx,sid,gm){if(map)txt("map",map);if(sid)txt("pname",sid);setPct(3);};
window.SetPlayerName=function(n){if(n)txt("pname",n);};
window.SetFilesTotal=function(n){total=Math.max(0,parseInt(n,10)||0);got=0;setPct(5);};
window.SetFilesNeeded=function(n){var need=Math.max(0,parseInt(n,10)||0);if(total>0){got=total-need;setPct(5+80*(got/total));}};
window.DownloadingFile=function(f){got++;if(total>0)setPct(5+80*Math.min(1,got/total));var s=String(f||"");if(s.length>100)s="..."+s.slice(-97);txt("file",s);};
var st=[[/workshop|addon|download/i,30],[/lua/i,88],[/client info/i,92],[/sending/i,96]];
window.SetStatusChanged=function(s){s=String(s||"");txt("status",s.replace(/\.+$/,""));for(var i=0;i<st.length;i++)if(st[i][0].test(s))setPct(st[i][1]);};
setInterval(function(){if(lastPct<85)setPct(lastPct+.15);},1000);
})();
